const ORDER = ['東海','甲州','中山','奥州','日光'];
const TYPES = ['ワイド','馬連','馬単','三連複','三連単'];
const UPS = ['堅い','中荒れ','大荒れ'];
const yen = n => n.toLocaleString('ja-JP') + '円';
const rank = ORDER.slice().sort((a,b) => D[b].total.roi - D[a].total.roi);
let cur = '甲州';

function tbl(head, rows){ return `<table class="mt"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows}</table>`; }
function roiCell(ret, cost){
  const v = cost ? ret / cost * 100 : 0;
  return `<td class="${v>=100?'pos':(ret?'neg':'zero')}">${v.toFixed(1)}%</td>`;
}

function render(){
  const d = D[cur], t = d.total;
  document.getElementById('tabs').innerHTML = ORDER.map(n =>
    `<div class="mtab${n===cur?' on':''}" data-n="${n}">${n}</div>`).join('');

  const typeRows = TYPES.map(ty => {
    const x = d.by_type[ty]; if (!x || !x.pt) return '';
    return `<tr><td>${ty}</td>${roiCell(x.ret, x.cost)}
      <td>${x.hits}点</td><td>${x.pt}点</td><td>${yen(x.cost)}</td><td>${yen(x.ret)}</td></tr>`;
  }).join('');

  const upRows = UPS.map(u => {
    const x = d.by_upset[u]; if (!x) return '';
    return `<tr><td>${u}</td>${roiCell(x.ret, x.cost)}
      <td>${x.hitr}R</td><td>${x.r}R</td><td>${yen(x.cost)}</td><td>${yen(x.ret)}</td></tr>`;
  }).join('');

  // 並びは回収率の高い順（2026-09-09 ユーザー決定）。レース名からレースページへ飛ぶ
  const hitRows = d.hits.map(r =>
    `<tr><td>${r.date.slice(5)} ${r.track}${r.r}R</td>
      <td class="nm"><a href="race.html?id=${r.race_id}">${r.name}</a></td>
      <td class="${r.roi >= 100 ? 'pos' : 'neg'}">${r.roi.toFixed(0)}%</td>
      <td>${r.points}点</td><td>${yen(r.ret)}</td></tr>`).join('');
  const rest = d.n_hits - d.hits.length;

  document.getElementById('body').innerHTML = `
    <div class="mhead">
      <div class="nm">${cur}<span class="rk">5案中${rank.indexOf(cur)+1}位</span></div>
      <div class="ds">何を見て買うか　<b>${d.materials.join('・')}</b></div>
      <div class="ds">選び方　${d.desc}（${d.n_rules}ルール）</div>
    </div>
    <div class="mroi">
      <div class="v ${t.roi>=100?'pos':'neg'}">${t.roi}%</div>
      <div class="s">投資 ${yen(t.cost)} → 払戻 ${yen(t.ret)}<br>
        買った ${t.races}レース / ${t.points}点 ・ 的中 ${t.hit_races}レース / ${t.hits}点</div>

    <div class="msec">券種べつ</div>

    <div class="msec">荒れ度べつ</div>
    ${tbl(['荒れ度','回収率','的中','買った','投資','払戻'], upRows)}
    <div class="msec">払戻があったレース</div>
    ${hitRows ? tbl(['レース','','回収率','買った','払戻'], hitRows) : '<div class="mnote">払戻のあったレースはありません</div>'}
    ${rest > 0 ? `<div class="mnote">ほか${rest}レースでも払戻あり（回収率の高い10件だけ表示）</div>` : ''}
  `;
  document.querySelectorAll('.mtab').forEach(el => el.onclick = () => { cur = el.dataset.n; render(); });
}
