.opt .lv,.sw .lv{min-width:0;padding:0 4px;letter-spacing:0}

.c1 .lv{border:0;color:#fff;font-weight:800}
.c1 .lv-s{background:#3B1E6E} .c1 .lv-a{background:#6D28D9}
.c1 .lv-b{background:#9F7AEA} .c1 .lv-c{background:#CFC9DC;color:#4A4458}
.c1 .lv-d{background:#EDEBF2;color:#8B8698}

.c3 .lv{border:0;font-weight:800}
.c3 .lv-s,.c3 .lv-a{background:#3B1E6E;color:#fff}
.c3 .lv-b{background:#CFC9DC;color:#3B1E6E}
.c3 .lv-c,.c3 .lv-d{background:#F1F1EE;color:#8A8A80}
