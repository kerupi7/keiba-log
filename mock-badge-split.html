<link rel="stylesheet" href="assets/style.css?v=20260818b">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:18px;color:var(--navy);margin:0 0 6px}
.lead{font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:12px}
.lead b{color:var(--text)}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #E4E4DE;

.desc b{color:var(--text)}
.desc .pm{color:var(--live)}
.stage{margin-top:4px}
.acard{margin-bottom:10px}

/* ── 共通: レースレベルを「着順の右」へ、AI評価は「クラスの右」に残す ── */
.opt .aruns .l1{display:flex;align-items:center}
.opt .aruns .l1 > *{order:5}
.opt .aruns .l1 .fb{order:1}
.opt .aruns .l1 .lv{order:2;margin:0 8px 0 4px;padding-right:9px;
  border-right:1px solid #E4E4DE;border-radius:3px 0 0 3px}
.opt .aruns .l1 .dt{order:3}
/* レベルは枠線のまま・見出しを添える */
.opt .aruns .l1 .lv{min-width:0;padding-left:4px}
.opt .aruns .l1 .lv::before{font-size:8px;font-weight:600;color:var(--cap);margin-right:2px}
/* AI評価は塗りのまま・見出しを添える */
.opt .aruns .l1 .aicol{margin-left:5px}
.opt .aruns .l1 .aicol::before{content:"AI";font-size:8px;font-weight:700;color:var(--cap);
  margin-right:2px;vertical-align:middle}

.b1 .aruns .l1 .lv::before{content:"レベル"}
.b2 .aruns .l1 .lv::before{content:"相手"}
.b3 .aruns .l1 .lv::before{content:"Lv"}
</style></head>
