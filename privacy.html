<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プライバシーポリシー（kelpie-weekly）</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --sub: #555; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eeeeee; --sub: #aaa; } }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 24px; }
  ul { padding-left: 1.2em; }
  .sub { color: var(--sub); font-size: 0.9rem; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>プライバシーポリシー（kelpie-weekly）</h1>
  <p>このアプリは、運営者本人の YouTube チャンネル「ウマるぱ」と Instagram「umarupa_keiba」の数字（再生回数など）を、運営者本人のパソコンで週に1回読むためだけに使います。</p>
  <ul>
    <li>読むのは数字だけです。動画や投稿の変更・削除・投稿はしません。</li>
    <li>読んだ数字は運営者のパソコンの中にだけ保存し、外部へ提供・販売しません。</li>
    <li>運営者以外の人のアカウントの情報は扱いません。</li>
  </ul>
  <p class="sub">2026年11月14日</p>
</main>
</body>
</html>
