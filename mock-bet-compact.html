, 6], [14, 3, 16], [14, 6, 8], [14, 6, 3], [14, 6, 16], [14, 16, 8], [14, 16, 3], [14, 16, 6], [16, 8, 3], [16, 8, 6], [16, 8, 14], [16, 3, 8], [16, 3, 14], [16, 6, 8], [16, 6, 14], [16, 14, 8], [16, 14, 3], [16, 14, 6]]}]}, "日光": {"points": 141, "desc": "甲州と中山のどちらか", "n_rules": 177, "types": [{"type": "ワイド", "tickets": [[12, 3], [12, 6], [12, 16], [8, 3], [8, 6], [8, 16], [3, 6], [3, 14], [3, 16], [6, 14], [6, 16], [14, 16]]}, {"type": "馬単", "tickets": [[6, 12], [16, 12]]}, {"type": "三連複", "tickets": [[12, 8, 3], [12, 8, 6], [12, 8, 16], [12, 3, 6], [12, 3, 14], [12, 3, 16], [12, 6, 14], [12, 6, 16], [12, 14, 16], [8, 3, 6], [8, 3, 14], [8, 3, 16], [8, 6, 14], [8, 6, 16], [8, 14, 16], [3, 6, 14], [3, 6, 16], [3, 14, 16], [6, 14, 16]]}, {"type": "三連単", "tickets": [[12, 8, 3], [12, 8, 6], [12, 8, 16], [12, 3, 8], [12, 3, 6], [12, 3, 14], [12, 3, 16], [12, 6, 8], [12, 6, 3], [12, 6, 14], [12, 6, 16], [12, 14, 3], [12, 14, 6], [12, 14, 16], [12, 16, 8], [12, 16, 3], [12, 16, 6], [12, 16, 14], [8, 12, 3], [8, 12, 6], [8, 12, 16], [8, 3, 12], [8, 3, 6], [8, 3, 14], [8, 3, 16], [8, 6, 12], [8, 6, 3], [8, 6, 14], [8, 6, 16], [8, 14, 3], [8, 14, 6], [8, 14, 16], [8, 16, 12], [8, 16, 3], [8, 16, 6], [8, 16, 14], [3, 12, 8], [3, 12, 6], [3, 12, 14], [3, 12, 16], [3, 8, 12], [3, 8, 6], [3, 8, 14], [3, 8, 16], [3, 6, 12], [3, 6, 8], [3, 6, 14], [3, 14, 12], [3, 14, 8], [3, 14, 6], [3, 14, 16], [3, 16, 12], [3, 16, 8], [3, 16, 14], [6, 12, 8], [6, 12, 3], [6, 12, 14], [6, 12, 16], [6, 8, 12], [6, 8, 3], [6, 8, 14], [6, 8, 16], [6, 3, 12], [6, 3, 8], [6, 3, 14], [6, 14, 12], [6, 14, 8], [6, 14, 3], [6, 14, 16], [6, 16, 12], [6, 16, 8], [6, 16, 14], [14, 12, 3], [14, 12, 6], [14, 12, 16], [14, 8, 3], [14, 8, 6], [14, 8, 16], [14, 3, 12], [14, 3, 8], [14, 3, 6], [14, 3, 16], [14, 6, 12], [14, 6, 8], [14, 6, 3], [14, 6, 16], [14, 16, 12], [14, 16, 8], [14, 16, 3], [14, 16, 6], [16, 12, 8], [16, 12, 3], [16, 12, 6], [16, 12, 14], [16, 8, 12], [16, 8, 3], [16, 8, 6], [16, 8, 14], [16, 3, 12], [16, 3, 8], [16, 3, 14], [16, 6, 12], [16, 6, 8], [16, 6, 14], [16, 14, 12], [16, 14, 8], [16, 14, 3], [16, 14, 6]]}]}}};
const ORDER = ['東海','甲州','中山','奥州','日光'];
let cur = '日光';
const yen = n => n.toLocaleString('ja-JP') + '円';
const FRAME = {1:'wk1',2:'wk2',3:'wk3',4:'wk4',5:'wk5',6:'wk6',7:'wk7',8:'wk8'};
function box(n){ const g=RACE.gates[n]; const c=FRAME[g]||'plain';
  return `<span class="hn ${c} sm">${n}</span>`; }
function boxes(ns, ordered){ return ns.map(box).join(`<span class="cbsep">${ordered?'→':'-'}</span>`); }
function list(ns){ return ns.map(box).join('<span class="cbsep">・</span>'); }

const PAYKEY = {'ワイド':'wide','馬連':'umaren','馬単':'umatan','三連複':'sanrenpuku','三連単':'sanrentan'};
function payoutOf(type, t){
  const v = RACE.payouts[PAYKEY[type]]; if (!v) return 0;
  const arr = Array.isArray(v) ? v : [v];
  const ordered = /馬単|三連単/.test(type);
  for (const e of arr){
    const a = ordered ? e.combination : [...e.combination].sort((x,y)=>x-y);
    const b = ordered ? t : [...t].sort((x,y)=>x-y);
    if (a.length===b.length && a.every((v2,i)=>v2===b[i])) return e.payout;
  }
  return 0;
}

/* ---- まとめ方の部品 ---- */
function combos(arr,k){ const out=[]; const rec=(s,cur)=>{ if(cur.length===k){out.push([...cur]);return;}
  for(let i=s;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop();} }; rec(0,[]); return out; }
function perms(arr,k){ const out=[]; const used=new Set(); const rec=(cur)=>{ if(cur.length===k){out.push([...cur]);return;}
  for(const a of arr){ if(used.has(a))continue; used.add(a);cur.push(a);rec(cur);cur.pop();used.delete(a);} }; rec([]); return out; }
const keyOf = (t, ordered) => (ordered ? t : [...t].sort((a,b)=>a-b)).join('-');

function analyse(type, tickets){
  const ordered = /馬単|三連単/.test(type);
  const k = tickets[0].length;
  const set = [...new Set(tickets.flat())].sort((a,b)=>a-b);
  const full = ordered ? perms(set,k) : combos(set,k);
  const have = new Set(tickets.map(t=>keyOf(t,ordered)));
  const missing = full.filter(t=>!have.has(keyOf(t,ordered)));
  return {ordered, k, set, full, missing};
}

/* 案A: ボックス＋除外 */
function groupsBox(type, tickets){
  const a = analyse(type, tickets);
  if (a.missing.length === 0)
    return [{lbl:`${a.set.length}頭ボックス`, set:a.set, n:tickets.length, tickets}];
  if (a.missing.length <= Math.max(2, Math.round(a.full.length * 0.25)))
    return [{lbl:`${a.set.length}頭ボックス`, set:a.set, n:tickets.length, tickets,
             ex:a.missing, ordered:a.ordered}];
  return groupsAxis(type, tickets);
}

/* 案B: 軸でまとめる */
function groupsAxis(type, tickets){
  const ordered = /馬単|三連単/.test(type);
  const k = tickets[0].length;
  let rest = tickets.map(t=>[...t]);
  const out = [];
  while (rest.length){
    const cnt = {};
    rest.forEach(t => new Set(ordered ? [t[0]] : t).forEach(h => cnt[h]=(cnt[h]||0)+1));
    const h = +Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
    const grp = rest.filter(t => ordered ? t[0]===h : t.includes(h));
    rest = rest.filter(t => !(ordered ? t[0]===h : t.includes(h)));
    if (k === 2){
      const others = grp.map(t => t[0]===h ? t[1] : t[0]);
      out.push({axis:h, others, n:grp.length, tickets:grp, ordered});
    } else {
      const rem = grp.map(t => t.filter(x=>x!==h));
      const remSet = [...new Set(rem.flat())].sort((a,b)=>a-b);
      const remFull = ordered ? perms(remSet, k-1) : combos(remSet, k-1);
      const remHave = new Set(rem.map(t=>keyOf(t,ordered)));
      const remMissing = remFull.filter(t=>!remHave.has(keyOf(t,ordered)));
      // 相手の組がほぼ全部そろっていれば「相手から2頭・除く◯」と書く（1点ずつ並べない）
      const complete = remMissing.length <= Math.max(2, Math.round(remFull.length * 0.25));
      out.push({axis:h, rem, remSet, complete, remMissing, n:grp.length, tickets:grp, ordered});
    }
  }
  return out;
}

function payLine(tickets, type){
  let ret = 0; const hits = [];
  for (const t of tickets){ const p = payoutOf(type, t); if (p){ ret += p; hits.push([t,p]); } }
  return {ret, hits};
}

function rowsFor(type, tickets, mode){
  if (mode === 'now')
    return tickets.map(t => {
      const p = payoutOf(type, t);
      return `<div class="bgrp"><span class="ty">${type}</span>
        <span class="bd">${boxes(t, /馬単|三連単/.test(type))}</span>
        <span class="amt">100円</span>
        <span class="pay ${p?'o':'x'}">${p?'✓ '+yen(p):'✕ 0円'}</span></div>`;
    }).join('');
  const grps = mode === 'box' ? groupsBox(type, tickets) : groupsAxis(type, tickets);
  return grps.map(g => {
    const {ret, hits} = payLine(g.tickets, type);
    let body;
    if (g.set) body = `${list(g.set)}<span class="lbl">のボックス</span>`;
    else if (g.others) body = `${box(g.axis)}<span class="cbsep">${g.ordered?'→':'-'}</span>${list(g.others)}`;
    else body = `${box(g.axis)}<span class="cbsep">${g.ordered?'→':'-'}</span>`
      + (g.complete
          ? `${list(g.remSet)}<span class="lbl">から${g.rem[0].length}頭${g.ordered ? '（順番自由）' : ''}</span>`
          : g.rem.map(r=>boxes(r, g.ordered)).join('<span class="cbsep">・</span>'));
    const exList = g.ex || (g.complete && g.remMissing && g.remMissing.length
      ? g.remMissing.map(t => [g.axis, ...t]) : null);
    const ex = exList && exList.length
      ? `<div class="ex">除く ${exList.map(t=>t.join(g.ordered?'→':'-')).join('・')}</div>` : '';
    const hit = hits.length
      ? `<div class="hit">的中 ${hits.map(([t,p])=>t.join(g.ordered||/馬単|三連単/.test(type)?'→':'-')+' '+yen(p)).join('・')}</div>` : '';
    return `<div class="bgrp"><span class="ty">${type}</span>
      <span class="bd">${body}</span>
      <span class="amt">${g.n}点 ${yen(g.n*100)}</span>
      <span class="pay ${ret?'o':'x'}">${ret?'✓ '+yen(ret):'✕ 0円'}</span>${ex}${hit}</div>`;
  }).join('');
}

function planHtml(mode){
  const pl = RACE.plans[cur];
  let pts = 0, ret = 0;
  const secs = pl.types.map(t => {
    pts += t.tickets.length;
    ret += payLine(t.tickets, t.type).ret;
    return rowsFor(t.type, t.tickets, mode);
  }).join('');
  return `<div class="secthead">${cur}<span class="cnt">${pl.desc} ${pl.n_rules}ルール</span></div>`
    + secs
    + `<div class="bsum"><span>合計 ${pts}点 ${yen(pts*100)}</span><span>払戻 ${yen(ret)}</span></div>`;
}

const CASES = [
  {k:'now', t:'現行　1点ずつ1行', d:'いま公開しているかたち。点数がそのまま行数になる。'},
  {k:'axis', t:'案A　軸でまとめる', d:'同じ馬を含む買い目をまとめて「3 - 6・8・12・14・16」の形にする。ユーザー指定の書き方。三連複・三連単は「軸 - 相手から2頭」になる。'},
  {k:'box', t:'案B　ボックス＋除外', d:'買い目の集合が総当たり（ボックス）に近いときは「6頭ボックス、除く 8-12」と書く。近くないときは案Aに落ちる。'},
];

function render(){
  document.getElementById('tabs').innerHTML = ORDER.map(n =>
    `<button class="${n===cur?'on':''}" data-n="${n}">${n}（${RACE.plans[n].points}点）</button>`).join('');
  document.getElementById('cols').innerHTML = CASES.map(c => `
    <div class="col"><h2>${c.t}</h2><p class="d">${c.d}</p>
      <div class="frame">${planHtml(c.k)}</div>
      <p class="d" style="min-height:0;margin-top:6px">行数 <b id="ln-${c.k}"></b></p>
    </div>`).join('');
  CASES.forEach(c => {
    const el = document.querySelectorAll('.col')[CASES.indexOf(c)];
    el.querySelector(`#ln-${c.k}`).textContent =
      el.querySelectorAll('.bgrp').length + '行';
  });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { cur = b.dataset.n; render(); });
}
render();
</script>
